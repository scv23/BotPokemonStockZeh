name: Discover store platforms

on:
  workflow_dispatch: {} # se lanza a mano desde la pestaña Actions

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run discover
        run: python discover.py

      - name: Publicar informe en el resumen del job
        run: cat data/discover_result.md >> "$GITHUB_STEP_SUMMARY"

name: Check Pokémon TCG Stock

on:
  schedule:
    # Cada 5 minutos: es el intervalo MÍNIMO que permite GitHub Actions.
    # Un cron más frecuente (*/2) no da error pero no se ejecuta más a
    # menudo. Además, la cola gratuita añade retrasos de 3-20 min y en
    # horas punta puede saltarse ejecuciones. Para latencia real de
    # 1-2 min haría falta un VPS con el script en bucle.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el workflow pueda hacer commit del nuevo state.json
permissions:
  contents: write

concurrency:
  group: pokestock-bot
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add data/state.json
          git diff --cached --quiet || git commit -m "Actualizar estado de stock [skip ci]"
          git push

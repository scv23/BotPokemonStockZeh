name: Check Pokémon TCG Stock

on:
  schedule:
    # Cada 5 minutos: es el intervalo MÍNIMO que permite GitHub Actions.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

# Necesario para que el workflow pueda hacer commit del nuevo state.json
permissions:
  contents: write

concurrency:
  group: pokestock-bot
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "pokestock-bot"
          git config user.email "actions@github.com"

          # 1) Commit local del estado nuevo (si no hay cambios, salimos)
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado."
            exit 0
          fi
          git commit -m "Actualizar estado de stock [skip ci]"

          # 2) Push con reintentos. Si otro run empujó entre medias,
          #    rebasamos con -X theirs: en un rebase, "theirs" es NUESTRO
          #    commit que se está reaplicando, así que el state.json que
          #    queda es siempre el de este run (el más reciente), SIN
          #    marcadores de conflicto jamás.
          BRANCH="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Push rechazado (intento $i), rebasando sobre origin/${BRANCH}..."
            git fetch origin "${BRANCH}"
            if ! git rebase -X theirs "origin/${BRANCH}"; then
              # Conflicto no resoluble automáticamente: abortamos y
              # renunciamos al commit de este ciclo. El estado se
              # regenera entero en el siguiente run, así que no pasa nada.
              git rebase --abort
              echo "Rebase imposible; se descarta el estado de este ciclo."
              exit 0
            fi
          done
          echo "No se pudo pushear tras 3 intentos; se descarta este ciclo."
          exit 0
